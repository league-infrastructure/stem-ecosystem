# This compose file runs the beta preview of the site: a container serving
# a production build, so a change can be reviewed at a real URL before it
# goes out to production GitHub Pages.
#
# Copy .env.example to .env and set SITE_HOSTNAME to the beta host before
# bringing it up. The Caddy labels publish the container to an external
# `caddy` network, which must already exist on the host.
#
#   docker compose -f docker/docker-compose.yml up -d --build
#   docker compose -f docker/docker-compose.yml logs -f
#   docker compose -f docker/docker-compose.yml down
#
# The build bakes SITE_URL into the static output: absolute URLs in
# llms.txt and /for-agents derive from it (see src/pages/llms.txt.ts), so
# a beta container built without it will advertise the wrong origin.
services:
  web:
    container_name: stem-ecosystem-beta
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        SITE_URL: ${SITE_URL:-http://localhost:8080}
    ports:
      - "${PORT:-8080}:80"
    labels:
      caddy: ${SITE_HOSTNAME:-}
      caddy.reverse_proxy: "{{upstreams 80}}"
    networks:
      - caddy
    restart: unless-stopped

networks:
  caddy:
    external: true
