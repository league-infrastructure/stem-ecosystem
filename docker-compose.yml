# Swarm stack file for the partner scraper (see scraper/docker/README.md).
# Deploy by hand:
#   TAG=<version> docker --context swarm1 stack deploy \
#     -c docker-compose.yml stem-ecosystem
# The ghcr image is public: do NOT pass --with-registry-auth.
x-league:
  stack: stem-ecosystem

services:
  scraper:
    image: ghcr.io/league-infrastructure/stem-ecosystem-scraper:${TAG:-latest}
    build:
      context: .
      dockerfile: scraper/docker/Dockerfile
    environment:
      # The secrets bundle (base64 KEY=value lines) is read from this file.
      SCRAPER_SECRETS_FILE: /run/secrets/stem-ecosystem_scraper_secrets
    secrets:
      - stem-ecosystem_scraper_secrets
    volumes:
      # Chromium needs more than Docker's 64 MB /dev/shm. Swarm ignores
      # shm_size and does not support host IPC, so use a 1 GiB tmpfs.
      - type: tmpfs
        target: /dev/shm
        tmpfs:
          size: 1073741824
    healthcheck:
      # The container's job is the scheduler; healthy while supercronic runs.
      test: ["CMD", "pgrep", "-x", "supercronic"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 30s
    deploy:
      replicas: 1
      restart_policy:
        condition: any
        delay: 10s
      resources:
        limits:
          memory: 3G
        reservations:
          memory: 1G

  updates:
    # Partner update-agent sidecar (HTTP API behind Caddy). See
    # scraper/docker/README.md, "Updates sidecar".
    image: ghcr.io/league-infrastructure/stem-ecosystem-updates:${TAG:-latest}
    build:
      context: .
      dockerfile: scraper/docker/Dockerfile.sidecar
    environment:
      SCRAPER_SECRETS_FILE: /run/secrets/stem-ecosystem_updates_secrets
      UPDATES_ALLOWED_ORIGINS: ${UPDATES_ALLOWED_ORIGINS:-https://www.sdstemecosystem.org,https://sdstemecosystem.org,http://localhost:4322,http://localhost:4323}
      UPDATES_FALLBACK_EMAIL: ${UPDATES_FALLBACK_EMAIL:-partners@sdstemecosystem.org}
      UPDATES_DAILY_SPEND_USD: ${UPDATES_DAILY_SPEND_USD:-5}
    secrets:
      - stem-ecosystem_updates_secrets
    networks:
      - caddy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:8000/healthz', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    deploy:
      replicas: 1
      labels:
        caddy: updates.jtlapp.net
        caddy.reverse_proxy: "{{upstreams 8000}}"
      restart_policy:
        condition: any
        delay: 10s
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 128M

networks:
  caddy:
    external: true

secrets:
  stem-ecosystem_scraper_secrets:
    external: true
  stem-ecosystem_updates_secrets:
    external: true
