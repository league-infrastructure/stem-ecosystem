name: Scheduled scrape

# Weekly unattended run of the scraper in scraper/ (scrape -> enrich ->
# normalize -> export). Moved here from the archived partner-scrape repo
# when the two repos were consolidated (2026-10-02).
#
# Cache and data live in the DigitalOcean Spaces bucket
# (s3://jtl-stem-ecosystem-scrape/{cache,data}); the SCRAPE_CACHE_DIR /
# PARTNER_SCRAPE_DATA_DIR defaults point there, so the job only needs to
# supply the DO_SPACES_* credentials and endpoint. Nothing is committed
# back to git. The source registry ships inside the package
# (scraper/partner_scrape/registry_data/), and the curated partner roster
# is this repo's own src/data/partners.json, read via --site-dir.
#
# Secrets required (referenced by name only -- never a literal value in
# this file). See scraper/docs/deploy/scheduled-run.md:
#   ANTHROPIC_API_KEY     - LLM enrichment
#   DO_SPACES_ACCESS_KEY  - Spaces bucket access key (cache + data)
#   DO_SPACES_SECRET_KEY  - Spaces bucket secret key

on:
  schedule:
    # Weekly: every Monday at 13:00 UTC (~06:00 America/Los_Angeles).
    - cron: '0 13 * * 1'
  workflow_dispatch: {}

# Manual activation/testing and the weekly cron should never race each
# other into two concurrent runs writing to the same bucket.
concurrency:
  group: scheduled-run
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  scrape:
    name: Scrape, enrich, export
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: scraper
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: '3.13'

      # --extra headless installs the optional playwright package so
      # JS-rendered/blocked sources (acquisition_policy.fetch_strategy =
      # "headless") are not blind.
      - name: Install dependencies
        run: uv sync --locked --extra headless

      # The playwright package is not the browser itself; --with-deps also
      # installs the OS libraries headless Chromium needs on ubuntu-latest.
      - name: Install Playwright's Chromium browser
        run: uv run playwright install --with-deps chromium

      - name: Run partner-scrape
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # Cache and data go to the Spaces bucket via the s3:// defaults;
          # only the endpoint and credentials are supplied here.
          DO_SPACES_ENDPOINT: https://sfo3.digitaloceanspaces.com
          DO_SPACES_ACCESS_KEY: ${{ secrets.DO_SPACES_ACCESS_KEY }}
          DO_SPACES_SECRET_KEY: ${{ secrets.DO_SPACES_SECRET_KEY }}
        run: |
          uv run partner-scrape --site-dir "${{ github.workspace }}" \
            | tee "${{ runner.temp }}/yield-report.txt"

      - name: Append yield report to job summary
        if: always()
        run: |
          {
            echo '## partner-scrape yield report'
            echo
            echo '```'
            cat "${{ runner.temp }}/yield-report.txt" 2>/dev/null || echo '(no report -- the run step failed before printing one)'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
