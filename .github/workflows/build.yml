name: Build

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['master']

permissions:
  contents: read

jobs:
  build:
    name: Build Astro site
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The scraper publishes to its own data/ and this repo pulls; the
      # generated data files are not tracked here, so the build cannot run
      # without this step. See clasi/issues/57.
      - name: Checkout partner-scrape data
        uses: actions/checkout@v4
        with:
          repository: league-infrastructure/partner-scrape
          path: .partner-scrape

      - name: Fetch published data
        run: scripts/fetch-data.sh "$GITHUB_WORKSPACE/.partner-scrape"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7
