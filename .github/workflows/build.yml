name: Build

on:
  push:
    branches: ['**']
    paths-ignore: ['scraper/**']
  pull_request:
    branches: ['master']
    paths-ignore: ['scraper/**']

permissions:
  contents: read

jobs:
  build:
    name: Build Astro site
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Always refresh: never build stale or absent data (prebuild only
      # fetches when files are missing). Public HTTPS, no secrets.
      - name: Fetch site data
        run: npm run fetch-data

      - name: Build
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7
